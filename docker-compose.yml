services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    
    depends_on:
      - db
      - redis
    volumes: 
      - .:/app

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tradelab
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    ports: 
      - "6379:6379"

  worker:
    build: .
    command: celery -A app.workers.celery_app:celery worker --loglevel=info
    env_file:
      - .env
    depends_on:
      - redis
      - db 
    volumes:
      - .:/app
    restart: unless-stopped

volumes:
  postgres_data:
